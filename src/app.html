<!doctype html>
<html lang="he" dir="rtl">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/assets/קבוצות-רכישה.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- תגי Open Graph / Twitter מוגדרים פר-דף ברכיב <Seo> ($lib/components/Seo.svelte)
		     ולא כאן: תג גלובלי היה מקדים את התג הפר-דפי ב-HTML, וכל שיתוף של דף קמפיין
		     בוואטסאפ היה מציג את כותרת דף הבית ואת כתובתו במקום את הקמפיין. -->
		<!-- אין כאן טעינת גופן מגוגל: גופן האתר (Heebo) מתארח אצלנו ומוגדר ב-app.css
		     ב-@font-face. כך אין preconnect ובקשת stylesheet חוסמת-רינדור לשרת חיצוני,
		     ולא נמסרות כתובות ה-IP של הגולשים לצד שלישי. -->
		<!-- Google Analytics — נכס משותף לכל אתרי "יוצאים לחירות". ההפרדה בין
		     האתרים נעשית לפי hostName, ולכן אותו מזהה משמש את כולם. -->
		<script async src="https://www.googletagmanager.com/gtag/js?id=G-YTEG7S0H9N"></script>
		<script>
			window.dataLayer = window.dataLayer || [];
			function gtag() { dataLayer.push(arguments); }
			gtag('js', new Date());
			gtag('config', 'G-YTEG7S0H9N');
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
